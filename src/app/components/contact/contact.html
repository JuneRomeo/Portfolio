<section class="contact-section">
  <h2>Get In Touch</h2>
  <p class="contact-subtitle">Have a question or want to work together? Drop me a message!</p>

  <div class="contact-container" *ngIf="!submitted; else successMessage">
    <form (ngSubmit)="onSubmit()" class="contact-form">
      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" [(ngModel)]="formData.name" name="name" required placeholder="John Doe">
      </div>

      <div class="form-group">
        <label for="email">Your Email</label>
        <input type="email" id="email" [(ngModel)]="formData.email" name="email" required placeholder="john@example.com">
      </div>

      <div class="form-group">
        <label for="message">Your Message</label>
        <textarea id="message" [(ngModel)]="formData.message" name="message" rows="5" required placeholder="Write your message here..."></textarea>
      </div>

      <button type="submit" class="submit-btn">Send Message</button>
    </form>
  </div>

  <ng-template #successMessage>
    <div class="success-box">
      <h3>Thank you, {{ formData.name }}!</h3>
      <p>Your message has been received successfully. I will get back to you soon.</p>
    </div>
  </ng-template>
</section>
