<section class="hero-section">
  <div class="hero-text-content">
    <span class="greeting">Hi There, I'm</span>
    <h1>{{ name }}</h1>
    <div class="role-divider"></div>
    <h2>{{ role }}</h2>
    <p>{{ bio }}</p>
    
    <div class="hero-buttons">
      <button class="btn-orange">Contact Me</button>
    </div>
  </div>

  <div class="hero-image-container">
    <div class="circle-profile-wrapper">
      <div class="outer-ring"></div>
      <div class="profile-circle">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600&auto=format&fit=crop&q=80" alt="Profile Picture" />
      </div>
    </div>
  </div>
</section>
