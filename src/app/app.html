<header class="navbar">
  <div class="logo">Dezven</div>
  <nav class="nav-links">
    <button [class.active]="activeTab === 'home'" (click)="setTab('home')">Home</button>
    <button [class.active]="activeTab === 'experience'" (click)="setTab('experience')">Experience</button>
    <button [class.active]="activeTab === 'projects'" (click)="setTab('projects')">Projects</button>
    <button [class.active]="activeTab === 'contact'" (click)="setTab('contact')">Contact Us</button>
  </nav>
</header>

<main class="main-container">
  <app-home *ngIf="activeTab === 'home'"></app-home>
  <app-experience *ngIf="activeTab === 'experience'"></app-experience>
  <app-projects *ngIf="activeTab === 'projects'"></app-projects>
  <app-contact *ngIf="activeTab === 'contact'"></app-contact>
</main>
